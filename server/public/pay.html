<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딱맞춤 QR 결제 (데모)</title>
<style>
  body { margin:0; font-family:"Asta Sans","Noto Sans KR","Malgun Gothic",sans-serif; background:#f3f3f3; color:#111; }
  main { max-width:420px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:22px; margin:0 0 20px; }
  .box { background:#fff; padding:24px; }
  .k { color:#666; font-size:14px; }
  .v { font-size:32px; font-weight:800; margin:4px 0 20px; }
  button { width:100%; height:60px; border:0; background:#111; color:#fff; font-size:18px; font-weight:700; }
  button:disabled { background:#bbb; }
  p { color:#666; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>딱맞춤 QR 결제</h1>
  <div class="box">
    <div class="k">매장</div><div id="store" style="font-size:18px; margin:4px 0 16px">-</div>
    <div class="k">결제 금액</div><div class="v" id="amount">-</div>
    <button id="go">결제하기 (데모)</button>
  </div>
  <p>데모 결제입니다. 실제로 청구되지 않습니다.</p>
</main>
<script>
  const code = location.pathname.split('/').pop();
  const won = (n) => n.toLocaleString('ko-KR') + '원';
  const btn = document.getElementById('go');
  fetch('/api/pay/' + code).then((r) => r.json()).then((x) => {
    document.getElementById('amount').textContent = won(x.amount || 0);
    document.getElementById('store').textContent = x.storeName || '-';
    if (x.paid) { btn.disabled = true; btn.textContent = '결제 완료'; }
  });
  btn.onclick = () => fetch('/api/pay/' + code + '/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
    .then(() => { btn.disabled = true; btn.textContent = '결제 완료'; });
</script>
</body>
</html>
