<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>딱맞춤, 동승자 주문</title>
<style>
  :root { --bg: #f6f4ef; --card: #fff; --line: #e7e2d8; --text: #1b1b1b; --mute: #7a7468; --acc: #ff8a1f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 120px; }
  h1 { font-size: 22px; margin: 6px 0 2px; letter-spacing: -0.5px; }
  h1 b { color: var(--acc); }
  .sub { color: var(--mute); font-size: 14px; margin-bottom: 14px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .m { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; font: inherit; cursor: pointer; }
  .m:active { transform: scale(.98); }
  .m .e { font-size: 26px; }
  .m .n { font-weight: 700; margin-top: 6px; }
  .m .p { color: var(--mute); font-size: 13px; }
  .cart { position: fixed; left: 0; right: 0; bottom: 0; background: #1b1b1b; color: #fff; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); }
  .cart .t { font-size: 13px; color: #bdb6a8; }
  .cart ul { list-style: none; padding: 0; margin: 6px 0 0; font-size: 14px; max-height: 90px; overflow: auto; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--acc); color: #111; font-weight: 700; padding: 10px 16px; border-radius: 99px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1><b>딱</b>맞춤, 같이 주문</h1>
  <div class="sub" id="store">차 화면의 QR로 들어왔어요. 고르면 운전자 화면에 바로 담겨요.</div>
  <input id="who" placeholder="내 이름 (예: 민지)" maxlength="10" />
  <div class="grid" id="menu"></div>
</div>
<div class="cart"><div class="t">우리 차 장바구니, <span id="code"></span></div><ul id="items"></ul></div>
<div class="toast" id="toast">담았어요</div>
<script>
const code = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
let menu = [];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
try { $('who').value = localStorage.getItem('who') || ''; } catch {}
$('code').textContent = code;

async function load() {
  const r = await fetch('/api/groups/' + code);
  if (!r.ok) { $('store').textContent = '주문방이 없어요. 차 화면의 QR을 다시 찍어주세요.'; return; }
  const g = await r.json();
  menu = g.menu;
  $('store').textContent = g.store.name + ', 고르면 운전자 화면에 담겨요';
  $('menu').innerHTML = menu.map((m) => `<button class="m" onclick="add('${m.id}')"><div class="e">${m.emoji}</div><div class="n">${esc(m.name)}</div><div class="p">${m.price.toLocaleString()}원</div></button>`).join('');
  renderItems(g.items);
}
function renderItems(items) {
  $('items').innerHTML = items.map((i) => `<li>${esc(i.who)}, ${esc(menu.find((m) => m.id === i.menuId)?.name || '')}</li>`).join('') || '<li style="color:#bdb6a8">아직 비어 있어요</li>';
}
async function add(menuId) {
  const who = $('who').value.trim() || '동승자';
  try { localStorage.setItem('who', who); } catch {}
  const r = await fetch(`/api/groups/${code}/items`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ who, menuId }) });
  if (r.ok) { renderItems((await r.json()).items); const t = $('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 900); }
}
load();
setInterval(async () => { const r = await fetch('/api/groups/' + code); if (r.ok) renderItems((await r.json()).items); }, 2000);
</script>
</body>
</html>
